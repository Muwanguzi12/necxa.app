<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Necxa — The Future of Social Commerce">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Necxa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Necxa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #0a0a0a;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #222;
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="loader"></div></div>
  <script>
    // Remove loading spinner once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();

      // Supabase implicit web auth returns the session in the URL fragment.
      // Flutter has consumed and persisted it before the first frame, so
      // remove credentials from the address bar and browser history.
      if (window.location.hash.indexOf('access_token=') !== -1) {
        window.history.replaceState(null, document.title, window.location.pathname);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
