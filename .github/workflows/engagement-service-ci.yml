name: Engagement Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/engagement-service/**'
      - '.github/workflows/engagement-service-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/engagement-service/**'
      - '.github/workflows/engagement-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/engagement-service/package-lock.json

      - name: Install dependencies
        working-directory: services/engagement-service
        run: npm ci --no-audit --no-fund

      - name: Build (TypeScript)
        working-directory: services/engagement-service
        run: npm run build

      - name: Run tests
        working-directory: services/engagement-service
        run: npm test

  mongo-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_ENGAGEMENT_DB }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/engagement-service/package-lock.json

      - name: Install and build
        working-directory: services/engagement-service
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Probe Mongo and create indexes
        working-directory: services/engagement-service
        run: npm run ci:mongo-check
