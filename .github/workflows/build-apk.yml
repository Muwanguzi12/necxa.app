name: Necxa Android CI & Release

on:
  push:
    branches: [ main, feature/integrate-necxa-studio-ffmpeg ]
  pull_request:
    branches: [ main, feature/unified-realtime-effects-engine, feature/integrate-necxa-studio-ffmpeg ]
  workflow_dispatch:

concurrency:
  group: necxa-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting of changed Dart files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No valid base commit supplied; checking Dart files changed in this commit."
            BASE_SHA="$(git rev-parse HEAD^)"
            RANGE="$BASE_SHA..HEAD"
          else
            RANGE="$BASE_SHA...HEAD"
          fi
          mapfile -t dart_files < <(
            git diff --name-only "$RANGE" -- '*.dart' |
              grep -E '\.dart$' |
              grep -v '^lib/screens/mobile_media_editor.dart$' || true
          )
          if (( ${#dart_files[@]} == 0 )); then
            echo "No eligible Dart files changed; formatting check skipped."
          else
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
        continue-on-error: true

  build:
    name: Build and identify release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker image prune -af || true
          echo "=== Disk after cleanup ==="
          df -h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install verified Necxa Studio FFmpeg runtime
        env:
          NECXA_FFMPEG_READ_TOKEN: ${{ secrets.NECXA_FFMPEG_READ_TOKEN }}
        run: bash scripts/install-necxa-ffmpeg.sh

      - name: Print build identity
        run: |
          echo "Commit : $GITHUB_SHA"
          echo "Branch : $GITHUB_REF_NAME"
          echo "Run    : $GITHUB_RUN_NUMBER"
          flutter --version
          git log --oneline -5

      - name: Get dependencies
        run: flutter pub get

      - name: Patch jcenter → mavenCentral for Gradle 9
        run: |
          mkdir -p ~/.gradle/init.d
          cp android/jcenter-fix.init.gradle ~/.gradle/init.d/

      - name: Build release APKs once
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.logging.stacktrace=full"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Write build provenance
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "run=$GITHUB_RUN_NUMBER"
          } > build/app/outputs/flutter-apk/BUILD_INFO.txt

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: necxa-android-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
