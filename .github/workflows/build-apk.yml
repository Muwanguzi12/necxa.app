name: Build APK

on:
  push:
    branches: [ main, fix/listing-wizard-liveness ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: false
        fetch-depth: 0

    # ── Free up disk space (~10GB) before heavy Flutter/FFmpeg build ──
    - name: Free disk space
      run: |
        echo "=== Disk before cleanup ==="
        df -h
        sudo rm -rf /usr/local/lib/android/sdk/emulator
        sudo rm -rf /usr/local/lib/android/sdk/system-images
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /opt/hostedtoolcache/node
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/.ghcup
        sudo apt-get clean
        docker image prune -af || true
        echo "=== Disk after cleanup ==="
        df -h

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.6'
        channel: 'stable'
        cache: false

    - name: Print build info
      run: |
        echo "==== BUILD INFO ===="
        echo "Commit : $GITHUB_SHA"
        echo "Branch : $GITHUB_REF_NAME"
        echo "Run    : $GITHUB_RUN_NUMBER"
        git log --oneline -5

    - name: Clean previous build artefacts
      run: flutter clean

    - name: Get fresh dependencies
      run: flutter pub get

    - name: Build APK Release (split per ABI)
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
      run: flutter build apk --release --split-per-abi

    - name: Add build provenance
      run: |
        printf "commit=%s\nbranch=%s\nrun=%s\n" \
          "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" \
          > build/app/outputs/flutter-apk/BUILD_INFO.txt

    - name: Upload Release APKs
      uses: actions/upload-artifact@v4
      with:
        name: necxa-apk-${{ github.run_number }}-${{ github.sha }}
        path: |
          build/app/outputs/flutter-apk/app-*-release.apk
          build/app/outputs/flutter-apk/BUILD_INFO.txt
        retention-days: 30
