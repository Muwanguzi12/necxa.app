name: Build iOS

on:
  # iOS builds are intentionally manual so Android-only work does not
  # consume macOS runners. Run this workflow when an iOS build is needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: false
        fetch-depth: 0

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Flutter dependencies
      run: flutter pub get

    - name: Build iOS App (No Codesign)
      run: flutter build ios --release --no-codesign

    - name: Package to IPA
      run: |
        mkdir -p Payload
        mv build/ios/iphoneos/Runner.app Payload/
        zip -qq -r -9 Necxa-iOS.ipa Payload

    - name: Upload iOS IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: necxa-ios-unsigned-${{ github.run_number }}-${{ github.sha }}
        path: Necxa-iOS.ipa
        retention-days: 7
