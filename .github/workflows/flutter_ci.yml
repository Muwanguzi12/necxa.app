name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build_apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: flutter build apk --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build iOS app
        run: flutter build ios --release --no-codesign
      
      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app
          path: build/ios/Release-iphoneos
          retention-days: 30

  build_windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get

      - name: Pre-download flutter_webrtc binaries
        shell: pwsh
        run: |
          $pubCache = if ($env:PUB_CACHE) { "$env:PUB_CACHE\hosted\pub.dev" } else { "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" }
          $webrtcDirs = Get-ChildItem -Path $pubCache -Filter "flutter_webrtc-*" -Directory -ErrorAction SilentlyContinue
          foreach ($d in $webrtcDirs) {
            $tpDir = Join-Path $d.FullName "third_party"
            $dlDir = Join-Path $tpDir "downloads"
            $zipPath = Join-Path $dlDir "libwebrtc.zip"
            $libDir = Join-Path $tpDir "libwebrtc"
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            if (-not (Test-Path $libDir)) {
              Write-Host "Pre-downloading libwebrtc.zip for $($d.Name)..."
              Invoke-WebRequest -Uri "https://github.com/flutter-webrtc/flutter-webrtc/releases/download/v1.4.0/libwebrtc.zip" -OutFile $zipPath
              Write-Host "Extracting libwebrtc into $tpDir..."
              Expand-Archive -Path $zipPath -DestinationPath $tpDir -Force
              Write-Host "Pre-extraction complete for $($d.Name)."
            } else {
              Write-Host "libwebrtc already present for $($d.Name)."
            }
          }
      
      - name: Build Windows app
        run: flutter build windows --release
      
      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-app
          path: build/windows/runner/Release
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/windows/runner/Release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Format check
        run: dart format --set-exit-if-changed --dry-run lib/
        continue-on-error: true
      
      - name: Dart linter
        run: flutter pub run lints
        continue-on-error: true
