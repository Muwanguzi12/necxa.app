[project]
name = "necxa-biometric-provider"
version = "0.1.0"
description = "Fail-closed biometric verification API for Necxa"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "pillow==11.3.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
