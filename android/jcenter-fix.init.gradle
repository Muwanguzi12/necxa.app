// jcenter-fix.init.gradle
// Gradle 9 removed the jcenter() method from RepositoryHandler.
// Some Flutter plugins (e.g. video_thumbnail) still call jcenter() in their
// own build.gradle (Groovy) files. This init script uses Groovy metaprogramming
// to add a no-op jcenter() method to RepositoryHandler so such calls succeed
// silently. Resolution falls through to google() + mavenCentral() which are
// already declared by the root build.gradle.kts allprojects block.
import org.gradle.api.internal.artifacts.dsl.DefaultRepositoryHandler

allprojects {
    beforeEvaluate {
        // Patch RepositoryHandler's metaclass to silently accept jcenter() calls.
        def repoHandlerClass = project.repositories.class
        if (!repoHandlerClass.metaClass.respondsTo(project.repositories, "jcenter")) {
            repoHandlerClass.metaClass.jcenter = {
                delegate.logger?.info("jcenter() shim — skipped (Gradle 9 compatibility)")
            }
        }
    }
}
